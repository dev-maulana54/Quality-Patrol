    <script>
        $('.sign_hadir').click(function() {
            var id = $(this).data('id');
            var url = "../../temuan_patrol/daftar_hadir.html/" + id;

            window.open(url, '_blank');
        });
        $('#list_dept').on('change', function() {
            const deptId = $(this).val();

            // kalau kosong => disable & reset seksi
            if (!deptId) {
                $('#list_seksi').prop('disabled', true);

                $('#list_seksi')
                    .empty()
                    .html('<option value="">-- Pilih Opsi --</option>')
                    .val('');


                return;
            }

            // enable seksi
            $('#list_seksi').prop('disabled', false);
            $('#list_seksi')
                .next('.selectx-container')
                .find('.selectx-trigger')
                .removeClass('disabled');
            $.ajax({
                url: '../../sendData.html',
                type: 'POST',
                data: {
                    keterangan: 'get_seksi_by_dept',
                    id_dept: deptId
                },
                dataType: 'json',
                success: function(response) {
                    const htmlOpt = (response && response.options) ? response.options : '';
                    const selectedSeksiId = (response && response.selected_seksi_id) ? response.selected_seksi_id : '';

                    // replace options seksi
                    $('#list_seksi')
                        .empty()
                        .html('<option value="">-- Pilih Opsi --</option>' + htmlOpt)
                        .val(selectedSeksiId);



                    // kalau SelectX punya setValue, sync juga (opsional)
                    if (selectedSeksiId && sxSeksi && typeof sxSeksi.setValue === 'function') {
                        sxSeksi.setValue(selectedSeksiId);
                    }

                    // =========================
                    // OPTIONAL: reset dept juga
                    // =========================
                    // Kalau Anda benar-benar mau dept balik kosong setelah sukses:
                    // $('#list_dept').val('');
                    // if (sxDept && typeof sxDept.setValue === 'function') sxDept.setValue('');
                    // (kalau perlu rebuild juga dept, sama polanya)
                },
                error: function(xhr, status, error) {
                    console.error('Error fetching seksi data:', error);
                }
            });
        });
        new SelectX('#nama_auditor_list', {
            multiple: true, // Paksa menjadi multiple
            searchable: true,
            clearable: true,
            placeholder: 'Pilih sesuatu...',
            onChange: (value) => console.log(value)
        });
        new SelectX('#nama_auditee_list', {
            multiple: true, // Paksa menjadi multiple
            searchable: true,
            clearable: true,
            placeholder: 'Pilih sesuatu...',
            onChange: (value) => console.log(value)
        });
        new SelectX('#list_dept', {
            multiple: true, // Paksa menjadi multiple
            searchable: true,
            clearable: true,
            placeholder: 'Pilih sesuatu...',
            onChange: (value) => console.log(value)
        });
        new SelectX('#list_seksi', {
            multiple: true, // Paksa menjadi multiple
            searchable: true,
            clearable: true,
            placeholder: 'Pilih sesuatu...',
            onChange: (value) => console.log(value)
        });
        $('#btn_tambahDaftarHadir').click(function() {
            var tanggal_patrol = $('#tanggal_patrol').val();

            // Ambil semua value (NPK) yang dipilih
            var nama_auditor_npk = $('#nama_auditor_list').val(); // ['NPK001', 'NPK002']

            if (!tanggal_patrol) {

                Notify.fire({
                    type: "error",
                    title: "Oops!",
                    text: "Tanggal Patrol harus diisi!",
                });
                return;
            }
            if (!nama_auditor_npk || nama_auditor_npk.length === 0) {

                Notify.fire({
                    type: "error",
                    title: "Oops!",
                    text: "Nama Auditor harus dipilih!",
                });
                return;
            }
        });
    </script>
    <script>
        // QPDB Auto Init - sidebar user info
        (function() {
            if (typeof QPDB === 'undefined') return;
            var u = QPDB.getCurrentUser();
            if (!u) { 
                // Cek apakah ini halaman login atau 404
                var fn = window.location.pathname;
                if (fn.indexOf('login') === -1 && fn.indexOf('404') === -1 && fn.indexOf('info_pengembangan') === -1 && fn.indexOf('welcome_message') === -1) {
                    window.location.href = '../auth/login.html'; 
                }
                return; 
            }
            var n = document.getElementById('sidebarUserName');
            var r = document.getElementById('sidebarRole');
            var p = document.getElementById('profileImg');
            if (n) n.textContent = u.nama;
            if (r) r.textContent = u.role_label;
            if (p) p.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.nama) + '&background=0d6efd&color=fff&size=128';
            var lb = document.getElementById('logoutBtn');
            if (lb) lb.addEventListener('click', function(e) {
                e.preventDefault(); QPDB.logoutUser(); 
                window.location.href = (window.location.pathname.indexOf('/admin/') !== -1 || window.location.pathname.indexOf('/users/') !== -1) 
                    ? '../auth/login.html' : 'auth/login.html';
            });
            document.querySelectorAll('.submenu-toggle').forEach(function(it) {
                it.addEventListener('click', function() { it.parentElement.classList.toggle('open'); });
            });
        })();
    </script>
